name: OpenTelemetry
on:
  workflow_run:
    workflows:
      - .github/workflows/copilot-setup-steps.yml
      - Autoversion
      - Claude
      - CodeQL
      - Copilot
      - Copilot cloud agent
      - Copilot code review
      - Dependency Graph
      - OpenAI Codex
      - Recompile Agentic Workflows
      - Release
      - Renovate
    types:
      - completed
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: plengauer/opentelemetry-github/actions/instrument/workflow@19061f1e87c01ed291ee56e45dacad3118106ffd # v5.53.1
        env:
          OTEL_EXPORTER_OTLP_ENDPOINT: ${{ secrets.OTEL_EXPORTER_OTLP_ENDPOINT }}
          OTEL_EXPORTER_OTLP_HEADERS: ${{ secrets.OTEL_EXPORTER_OTLP_HEADERS }}
    container: ghcr.io/plengauer/opentelemetry-github-workflow-instrumentation-runner:v5.54.0
    permissions:
      actions: read
